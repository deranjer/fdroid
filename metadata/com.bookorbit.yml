AuthorName: deranjer
Name: BookOrbit
Summary: Self-hosted ebook & audiobook client
Description: |
  Native Android client for BookOrbit, a self-hosted ebook and audiobook library
  server. Browse and search your library, read EPUBs and PDFs, and listen to
  audiobooks with background playback, sleep timer, and Chromecast support — all
  synced with your own server.

