name: Update F-Droid repo

on:
  schedule:
    - cron: '0 6 * * *'   # daily 06:00 UTC
  workflow_dispatch:

# Needed for the GitHub Pages deploy
permissions:
  contents: read
  pages: write
  id-token: write

# Avoid overlapping index regenerations
concurrency:
  group: fdroid-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # jarsigner (index signing) comes from the JDK
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # apksigner + aapt let fdroid verify/parse APKs without a full Android SDK
      - name: Install Android tools
        run: sudo apt-get update && sudo apt-get install -y apksigner aapt

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      # Pull the latest release APK that actually carries an .apk asset. Some
      # releases are backend/Docker only (no APK), so we can't just take the
      # newest tag — pick the most recent release whose assets include an APK.
      - name: Download Domitara APK
        env:
          # domitara/domitara is public, so the default token can read its releases
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p repo
          TAG=$(gh api 'repos/domitara/domitara/releases?per_page=100' \
            -q 'first(.[] | select(.draft | not) | select(any(.assets[]; .name | endswith(".apk")))) | .tag_name')
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "::error::No release with an .apk asset found" && exit 1
          fi
          echo "Latest release with an APK: $TAG"
          gh release download "$TAG" --repo domitara/domitara \
            --pattern '*.apk' --dir repo/ --clobber

      # Same pattern for Nodeira. If Nodeira/nodeira is private, set the
      # NODEIRA_RELEASE_TOKEN secret to a PAT with read access to its releases;
      # otherwise the default token reads its public releases.
      - name: Download Nodeira APK
        env:
          GH_TOKEN: ${{ secrets.NODEIRA_RELEASE_TOKEN || github.token }}
        run: |
          mkdir -p repo
          TAG=$(gh api 'repos/Nodeira/nodeira/releases?per_page=100' \
            -q 'first(.[] | select(.draft | not) | select(any(.assets[]; .name | endswith(".apk")))) | .tag_name')
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "::error::No Nodeira release with an .apk asset found" && exit 1
          fi
          echo "Latest Nodeira release with an APK: $TAG"
          gh release download "$TAG" --repo Nodeira/nodeira \
            --pattern '*.apk' --dir repo/ --clobber

      # Same pattern for BookOrbit. deranjer/bookorbit-android is public, so the
      # default token can read its releases.
      - name: Download BookOrbit APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p repo
          TAG=$(gh api 'repos/deranjer/bookorbit-android/releases?per_page=100' \
            -q 'first(.[] | select(.draft | not) | select(any(.assets[]; .name | endswith(".apk")))) | .tag_name')
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "::error::No BookOrbit release with an .apk asset found" && exit 1
          fi
          echo "Latest BookOrbit release with an APK: $TAG"
          gh release download "$TAG" --repo deranjer/bookorbit-android \
            --pattern '*.apk' --dir repo/ --clobber

      # Restore signing material; passwords are appended so they never sit in git
      - name: Restore keystore & secrets
        env:
          FDROID_KEYSTORE_BASE64: ${{ secrets.FDROID_KEYSTORE_BASE64 }}
          FDROID_KEYSTORE_PASS: ${{ secrets.FDROID_KEYSTORE_PASS }}
          FDROID_KEY_PASS: ${{ secrets.FDROID_KEY_PASS }}
        run: |
          echo "$FDROID_KEYSTORE_BASE64" | base64 -d > keystore.p12
          {
            echo "keystorepass: $FDROID_KEYSTORE_PASS"
            echo "keypass: $FDROID_KEY_PASS"
          } >> config.yml
          # fdroid warns (and may refuse) if these are group/world-readable
          chmod 600 config.yml keystore.p12

      - name: Generate index
        run: uvx --from fdroidserver fdroid update --create-metadata --verbose

      # Stage ONLY the public repo dir — never publish keystore.p12 or config.yml
      - name: Stage Pages site
        run: |
          rm -rf site && mkdir -p site
          cp -r repo site/repo
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>deranjer's F-Droid repo</title>
            <style>
              :root { color-scheme: light dark; }
              body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
                     max-width: 760px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
              h1 { margin-bottom: .25rem; }
              .repo-url { background: rgba(127,127,127,.15); padding: .5rem .75rem;
                          border-radius: 6px; font-family: ui-monospace, monospace;
                          word-break: break-all; }
              ul.apps { list-style: none; padding: 0; }
              li.app { display: flex; gap: 1rem; align-items: center;
                       padding: 1rem 0; border-top: 1px solid rgba(127,127,127,.25); }
              li.app img { width: 48px; height: 48px; border-radius: 10px; object-fit: cover;
                           background: rgba(127,127,127,.15); flex: 0 0 auto; }
              .app-body { flex: 1 1 auto; min-width: 0; }
              .app-name { font-weight: 600; }
              .app-summary { font-size: .9rem; opacity: .8; }
              .app-meta { font-size: .85rem; opacity: .7; }
              a.dl { white-space: nowrap; font-size: .9rem; }
              .muted { opacity: .7; }
            </style>
          </head>
          <body>
            <h1>deranjer's F-Droid repo</h1>
            <p>Add this URL in the F-Droid client:</p>
            <p class="repo-url">https://deranjer.github.io/fdroid/repo</p>
            <h2>Apps</h2>
            <ul class="apps" id="apps"><li class="muted">Loading…</li></ul>
            <script>
              const REPO = "repo";
              const loc = v => !v ? "" : (typeof v === "string" ? v : (v["en-US"] || Object.values(v)[0] || ""));
              const fmtSize = b => !b ? "" : b > 1048576 ? (b/1048576).toFixed(1)+" MB" : Math.round(b/1024)+" KB";
              fetch(REPO + "/index-v2.json")
                .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
                .then(data => {
                  const pkgs = data.packages || {};
                  const list = document.getElementById("apps");
                  list.innerHTML = "";
                  const ids = Object.keys(pkgs).sort((a, b) =>
                    loc(pkgs[a].metadata && pkgs[a].metadata.name).localeCompare(
                    loc(pkgs[b].metadata && pkgs[b].metadata.name)));
                  if (!ids.length) { list.innerHTML = '<li class="muted">No apps in this repo yet.</li>'; return; }
                  for (const id of ids) {
                    const meta = pkgs[id].metadata || {};
                    const versions = Object.values(pkgs[id].versions || {});
                    versions.sort((a, b) =>
                      (b.manifest && b.manifest.versionCode || 0) - (a.manifest && a.manifest.versionCode || 0));
                    const latest = versions[0];
                    const iconObj = loc(meta.icon);
                    const iconPath = iconObj && iconObj.name ? REPO + iconObj.name : "";
                    const li = document.createElement("li");
                    li.className = "app";
                    const img = document.createElement("img");
                    if (iconPath) { img.src = iconPath; img.alt = ""; } else { img.style.visibility = "hidden"; }
                    img.onerror = () => { img.style.visibility = "hidden"; };
                    const body = document.createElement("div");
                    body.className = "app-body";
                    const vName = latest && latest.manifest ? latest.manifest.versionName : "";
                    const size = latest && latest.file ? fmtSize(latest.file.size) : "";
                    body.innerHTML =
                      '<div class="app-name"></div>' +
                      '<div class="app-summary"></div>' +
                      '<div class="app-meta">v' + (vName || "?") + (size ? " · " + size : "") +
                        ' · <span class="muted">' + id + '</span></div>';
                    body.querySelector(".app-name").textContent = loc(meta.name) || id;
                    body.querySelector(".app-summary").textContent = loc(meta.summary) || "";
                    li.appendChild(img);
                    li.appendChild(body);
                    if (latest && latest.file && latest.file.name) {
                      const a = document.createElement("a");
                      a.className = "dl";
                      a.href = REPO + latest.file.name;
                      a.textContent = "Download APK";
                      li.appendChild(a);
                    }
                    list.appendChild(li);
                  }
                })
                .catch(e => {
                  document.getElementById("apps").innerHTML =
                    '<li class="muted">Could not load app index (' + e + ').</li>';
                });
            </script>
          </body>
          </html>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v4
